<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Track Your Orders | TechieTown</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .account-page { max-width: 1100px; margin: 45px auto 80px; padding: 0 20px; }
    .account-heading { margin-bottom: 28px; }
    .account-heading h1 { color: #d4af37; margin: 0 0 8px; }
    .account-heading p, .muted { color: #aaa; }
    .tracking-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; }
    .panel, .order-card, .tracking-card { background: #151515; border: 1px solid #333; border-radius: 12px; padding: 22px; }
    .panel h2, .tracking-card h2 { color: #d4af37; margin-top: 0; }
    .tracking-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px 20px; padding: 16px; background: #202020; border-radius: 8px; }
    .tracking-summary p { margin: 4px 0; }
    .tracking-items { color: #ccc; padding-left: 20px; }
    .order-card { margin-bottom: 14px; padding: 16px; }
    .order-card h3 { margin: 0 0 5px; color: #fff; }
    .order-card p { color: #aaa; margin: 7px 0; }
    .button-link { display: inline-block; margin-top: 8px; color: #111; background: #d4af37; padding: 9px 14px; border-radius: 6px; font-weight: 700; text-decoration: none; }
    .notice { padding: 12px 14px; border-radius: 7px; background: #222; color: #ddd; }
    .notice.error { border: 1px solid #ff6b6b; color: #ff9a9a; }
    .notice.info { border: 1px solid #444; }
    @media (max-width: 760px) { .tracking-layout { grid-template-columns: 1fr; } }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="logo">TECHIETOWN</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="tracking.html" class="active">Track Order</a></li>
      </ul>
    </nav>
    <div id="authLinks" class="auth-links"></div>
  </header>

  <main class="account-page">
    <div class="account-heading">
      <h1>Track your orders</h1>
      <p>Follow payment and fulfillment updates for orders placed with your account.</p>
    </div>
    <p id="tracking-message" class="notice error" role="alert" hidden></p>
    <div class="tracking-layout">
      <section class="panel" aria-live="polite">
        <h2>Order details</h2>
        <div id="selected-order"><p class="muted">Loading your order history…</p></div>
      </section>
      <aside class="panel">
        <h2>Order history</h2>
        <div id="order-history"></div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <p>Need help? <a href="contact.html">Contact TechieTown</a></p>
    </div>
  </footer>
  <script src="js/auth.js"></script>
  <script src="js/tracking.js"></script>
</body>

</html>
