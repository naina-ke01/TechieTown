<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TechieTown - Track Shipping</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      color: #d4af37;
      margin-bottom: 20px;
    }

    form {
      background: #222;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
    }

    button {
      background: #d4af37;
      border: none;
      padding: 12px 20px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      color: #111;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #c19e34;
    }

    .tracking-info {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h2>Track Your Shipment</h2>

  <form id="trackingForm">
    <input type="text" id="orderId" placeholder="Enter Order ID" required />
    <button type="submit">Track</button>
  </form>

  <div class="tracking-info" id="trackingInfo" style="display:none;"></div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      alert('Please login first!');
      window.location.href = '/login.html';
    }

    document.getElementById('trackingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const orderId = e.target.orderId.value.trim();

      if (!orderId) return alert('Please enter an Order ID');

      // Fetch shipping details from backend (assuming /shipping/:orderId route)
      const res = await fetch(`/shipping/${orderId}`, {
        headers: {
          'Authorization': `Bearer ${token}`,
        },
      });

      const infoDiv = document.getElementById('trackingInfo');
      infoDiv.style.display = 'block';

      if (res.ok) {
        const shipping = await res.json();
        infoDiv.innerHTML = `
          <h3>Shipping Details for Order #${orderId}</h3>
          <p><strong>Status:</strong> ${shipping.status || 'N/A'}</p>
          <p><strong>Estimated Delivery:</strong> ${shipping.estimatedDelivery || 'N/A'}</p>
          <p><strong>Tracking Number:</strong> ${shipping.trackingNumber || 'N/A'}</p>
          <p><strong>Carrier:</strong> ${shipping.carrier || 'N/A'}</p>
        `;
      } else {
        infoDiv.innerHTML = `<p style="color: #ff6666;">Shipping info not found for Order #${orderId}</p>`;
      }
    });
  </script>
</body>
</html>
