<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechieTown - M-Pesa Checkout</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding: 0;
    }
    .hero {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, #111, #222);
    }
    .hero h1 {
      color: #d4af37;
      margin-bottom: 10px;
      font-size: 2rem;
    }
    .hero p {
      color: #bbb;
      font-size: 1rem;
    }
    .featured {
      max-width: 500px;
      margin: 40px auto;
      background: #111;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.1);
    }
    .featured h2 {
      text-align: center;
      color: #d4af37;
      margin-bottom: 25px;
    }
    form label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #d4af37;
    }
    form input, form textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    form input::placeholder, form textarea::placeholder {
      color: #888;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #d4af37;
      color: #111;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .btn:hover {
      background: #c19e34;
      transform: scale(1.03);
    }
    .payment-icons {
      text-align: center;
      margin-top: 25px;
    }
    .payment-icons img {
      width: 55px;
      height: auto;
      margin: 10px;
      filter: brightness(0.9);
      transition: 0.3s ease;
    }
    .payment-icons img:hover {
      transform: scale(1.1);
      filter: brightness(1);
    }
    .footer-bottom {
      text-align: center;
      padding: 15px 10px;
      background: #111;
      color: #888;
      font-size: 0.9rem;
    }
    .footer-bottom a {
      color: #d4af37;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="logo">TECHIETOWN</div>
    <nav>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <h1>M-Pesa Payment Checkout</h1>
    <p>Complete your order securely using M-Pesa.</p>
  </section>

  <section class="featured">
    <h2>Enter Payment Details</h2>
    <form id="mpesa-form">
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" placeholder="John Doe" required>

      <label for="phone">M-Pesa Number:</label>
      <input type="tel" id="phone" name="phone" placeholder="07XXXXXXXX" required>

      <label for="amount">Amount (KES):</label>
      <input type="number" id="amount" name="amount" readonly required>

      <label for="address">Delivery Address:</label>
      <textarea id="address" name="address" placeholder="Enter your delivery address" required></textarea>

      <button type="button" id="payButton" class="btn">Pay with M-Pesa</button>
    </form>

    <div class="payment-icons">
      <img src="myImg/socials/mpesa-seeklogo.com.svg" alt="M-Pesa">
      <img src="myImg/socials/Visa.svg" alt="Visa">
      <img src="myImg/socials/equitel.png" alt="Equitel">
      <img src="myImg/socials/mastercard.svg" alt="Mastercard">
    </div>
  </section>

  <div class="footer-bottom">
    <p>Copyright © 2025 TechieTown. All rights reserved. Designed by 
      <a href="#">@nainaKe_</a>
    </p>
  </div>

  <!-- Include M-Pesa Checkout JS -->
  <script src="js/mpesa-checkout.js"></script>

  <!-- Initialize form data -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      let total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
      total = Math.round(Number(total));

      const amountInput = document.getElementById("amount");
      amountInput.value = total > 0 ? total : 1;
    });
  </script>
</body>
</html>
